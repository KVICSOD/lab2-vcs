name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Lab3.slnx

      - name: Build
        run: dotnet build Lab3.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Lab3.slnx -c Release --no-build --verbosity normal
